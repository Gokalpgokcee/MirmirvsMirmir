<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mırmır Savaşları - Kedi Kart Oyunu</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>🐾 Mırmır Savaşları 🐾</h1>
        
        <!-- Lobi Alanı -->
        <div id="lobby" class="card">
            <h2>Oda İşlemleri</h2>
            <button id="create-btn">Oda Kur</button>
            <br><br>
            <input type="text" id="roomCodeInput" placeholder="Oda Kodu Gir">
            <button id="join-btn">Odaya Katıl</button>
        </div>

        <!-- Oyun Alanı (Başlangıçta gizli) -->
        <div id="game-area" class="hidden">
            <div class="stats-bar">
                <span>Oda Kodu: <strong id="display-room">-</strong></span>
                <br>
                <span>Rakip Canı (HP): <strong id="opponent-hp">100</strong></span> | 
                <span>Senin Canın (HP): <strong id="my-hp">100</strong></span>
            </div>

            <h3>Kartını Seç!</h3>
            <div class="battlefield">
                <div class="card-item" id="card-mirmir">
                    <h3>Kızgın Mırmır</h3>
                    <p>Güç: 35</p>
                    <p>Öfke Tırnağı</p>
                </div>
                <div class="card-item" id="card-tifil">
                    <h3>Tembel Tıfıl</h3>
                    <p>Güç: 15</p>
                    <p>Sert Kabuk</p>
                </div>
            </div>

            <div id="log" class="card">Oda bekleniyor...</div>
        </div>
    </div>

    <!-- Firebase ve Oyun Mantığı (Modüler) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
        import { getDatabase, ref, set, get, update, onValue } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDyVLByvOmv8EZdWiq4Izjn8c0Ifer0qQ8",
            authDomain: "mirmirvsmirmir.firebaseapp.com",
            databaseURL: "https://mirmirvsmirmir-default-rtdb.firebaseio.com",
            projectId: "mirmirvsmirmir",
            storageBucket: "mirmirvsmirmir.firebasestorage.app",
            messagingSenderId: "587582941001",
            appId: "1:587582941001:web:50aca493d92e3f95281c98",
            measurementId: "G-5CMEM5R5V0"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentRoom = null;
        let myRole = null;

        // Oda Kurma
        document.getElementById('create-btn').addEventListener('click', () => {
            currentRoom = Math.floor(1000 + Math.random() * 9000).toString();
            myRole = 'host';

            set(ref(db, 'rooms/' + currentRoom), {
                hostHp: 100,
                guestHp: 100,
                status: 'Bekleniyor',
                lastAction: 'Oda kuruldu. Kardeşinin girmesi bekleniyor.'
            }).then(() => {
                initGameUI();
                listenRoom();
            });
        });

        // Odaya Katılma
        document.getElementById('join-btn').addEventListener('click', () => {
            const code = document.getElementById('roomCodeInput').value.trim();
            if (!code) {
                alert('Lütfen bir oda kodu gir!');
                return;
            }

            currentRoom = code;
            myRole = 'guest';

            get(ref(db, 'rooms/' + currentRoom)).then((snapshot) => {
                if (snapshot.exists()) {
                    update(ref(db, 'rooms/' + currentRoom), {
                        status: 'Başladı',
                        lastAction: 'Kardeşin odaya katıldı! Savaş başlasın!'
                    });
                    initGameUI();
                    listenRoom();
                } else {
                    alert('Böyle bir oda bulunamadı!');
                }
            });
        });

        function initGameUI() {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('display-room').innerText = currentRoom;
        }

        function listenRoom() {
            onValue(ref(db, 'rooms/' + currentRoom), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;

                if (myRole === 'host') {
                    document.getElementById('my-hp').innerText = data.hostHp;
                    document.getElementById('opponent-hp').innerText = data.guestHp;
                } else {
                    document.getElementById('my-hp').innerText = data.guestHp;
                    document.getElementById('opponent-hp').innerText = data.hostHp;
                }

                document.getElementById('log').innerText = data.lastAction;

                if (data.hostHp <= 0 || data.guestHp <= 0) {
                    alert('Oyun bitti! Kedi öldüçe kaybedersiniz!');
                    location.reload();
                }
            });
        }

        // Kart Oynama Olayları
        document.getElementById('card-mirmir').addEventListener('click', () => playCard('Kızgın Mırmır', 35));
        document.getElementById('card-tifil').addEventListener('click', () => playCard('Tembel Tıfıl', 15));

        function playCard(cardName, damage) {
            if (!currentRoom) return;

            get(ref(db, 'rooms/' + currentRoom)).then((snapshot) => {
                const data = snapshot.val();
                let updates = {};

                if (myRole === 'host') {
                    let newGuestHp = data.guestHp - damage;
                    updates.guestHp = newGuestHp < 0 ? 0 : newGuestHp;
                    updates.lastAction = `Sen (${cardName}) kartını oynadın!`;
                } else {
                    let newHostHp = data.hostHp - damage;
                    updates.hostHp = newHostHp < 0 ? 0 : newHostHp;
                    updates.lastAction = `Kardeşin (${cardName}) kartını oynadı!`;
                }

                update(ref(db, 'rooms/' + currentRoom), updates);
            });
        }
    </script>
</body>
</html>
